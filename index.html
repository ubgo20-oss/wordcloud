<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>即時文字雲</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; font-size: 2rem; margin-bottom: 8px; color: #38bdf8; }
.subtitle { text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: 0.9rem; }
.input-area { display: flex; gap: 8px; margin-bottom: 32px; }
.input-area input {
  flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid #334155;
  background: #1e293b; color: #e2e8f0; font-size: 1rem; outline: none;
}
.input-area input:focus { border-color: #38bdf8; }
.input-area button {
  padding: 12px 24px; border-radius: 12px; border: none; background: #38bdf8;
  color: #0f172a; font-weight: 600; cursor: pointer; font-size: 1rem;
}
.input-area button:hover { background: #7dd3fc; }
.cloud { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding: 24px; min-height: 300px; }
.word-item {
  display: inline-block; cursor: default; transition: all 0.3s;
  animation: pop 0.4s ease-out;
  color: #e2e8f0;
}
.word-item:hover { transform: scale(1.15); color: #38bdf8; }
.word-item:nth-child(3n) { color: #f472b6; }
.word-item:nth-child(5n) { color: #34d399; }
.word-item:nth-child(7n) { color: #fbbf24; }
.word-item:nth-child(11n) { color: #60a5fa; }
@keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.size-sm { font-size: 0.8rem; }
.size-md { font-size: 1.1rem; }
.size-lg { font-size: 1.5rem; }
.size-xl { font-size: 2rem; }
.size-xxl { font-size: 2.5rem; }
.count-badge {
  display: inline-block; margin-left: 3px; font-size: 0.6em;
  opacity: 0.5; vertical-align: super;
}
.stats { text-align: center; color: #64748b; font-size: 0.85rem; margin-bottom: 16px; }
.footer { text-align: center; color: #475569; font-size: 0.8rem; margin-top: 32px; }
</style>
</head>
<body>
<div class="container">
  <h1>即時文字雲</h1>
  <p class="subtitle">輸入關鍵字，即時顯示</p>
  <div class="input-area">
    <input type="text" id="wordInput" placeholder="輸入關鍵字..." maxlength="20">
    <button id="submitBtn">送出</button>
  </div>
  <div class="stats">
    <span id="totalCount">0</span> 個關鍵字
    <span style="margin:0 12px;color:#334155">|</span>
    <button id="clearBtn" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:0.85rem;text-decoration:underline">清除全部</button>
  </div>
  <div class="cloud" id="wordCloud"></div>
  <p class="footer">資料即時同步 — 關閉再開，資料仍在</p>
</div>
<script>
const SUPABASE_URL = 'https://gqowayjtuoqzdeuijnsh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdxb3dheWp0dW9xemRldWlqbnNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0ODE2NDcsImV4cCI6MjA5NTA1NzY0N30.UF_baULxgx3LA_MxSIdCL6qfODeR03ZGYPXU5jhrSqQ';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  realtime: { heartbeatIntervalMs: 15000 }
});
const wordInput = document.getElementById('wordInput');
const submitBtn = document.getElementById('submitBtn');
const wordCloud = document.getElementById('wordCloud');
const totalCount = document.getElementById('totalCount');

function getSize(count) {
  if (count <= 1) return 'size-sm';
  if (count <= 3) return 'size-md';
  if (count <= 6) return 'size-lg';
  if (count <= 10) return 'size-xl';
  return 'size-xxl';
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function render(words) {
  wordCloud.innerHTML = '';
  totalCount.textContent = words.reduce((s, w) => s + w.count, 0);
  shuffle(words);
  words.forEach(w => {
    const el = document.createElement('span');
    el.className = 'word-item ' + getSize(w.count);
    el.innerHTML = w.word + '<span class="count-badge">' + w.count + '</span>';
    el.title = '按兩下刪除「' + w.word + '」';
    el.ondblclick = () => deleteWord(w.word);
    wordCloud.appendChild(el);
  });
}

async function load() {
  const { data, error } = await sb.from('wordcloud_words').select('word');
  if (error) { console.error('load error:', error); return; }
  const map = {};
  (data || []).forEach(r => { map[r.word] = (map[r.word] || 0) + 1; });
  render(Object.keys(map).map(k => ({ word: k, count: map[k] })));
}

async function submit() {
  const word = wordInput.value.trim();
  if (!word) return;
  wordInput.value = '';
  const { error } = await sb.from('wordcloud_words').insert({ word });
  if (error) { console.error('submit error:', error); alert('送出失敗：' + error.message); }
}

submitBtn.onclick = submit;
wordInput.onkeydown = e => { if (e.key === 'Enter') submit(); };

async function deleteWord(word) {
  if (!confirm('刪除「' + word + '」？')) return;
  await sb.from('wordcloud_words').delete().eq('word', word);
}

async function clearAll() {
  if (!confirm('清除全部關鍵字？')) return;
  await sb.from('wordcloud_words').delete().neq('id', 0);
}

document.getElementById('clearBtn').onclick = clearAll;

sb.channel('cloudchan')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'wordcloud_words' }, () => load())
  .subscribe(status => { if (status !== 'SUBSCRIBED') console.warn('realtime status:', status); });

load();
</script>
</body>
</html>
